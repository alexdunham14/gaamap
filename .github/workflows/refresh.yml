name: Refresh fixtures
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixtures from gaa.ie
        run: ./scripts/fetch.py
      # Camogie is a separate association with a separate site. Its fetch failing must not
      # lose the gaa.ie refresh, so the step is allowed to fail and its season file stays as it was.
      - name: Fetch camogie fixtures from camogie.ie
        run: ./scripts/fetch_camogie.py
        continue-on-error: true
      # Same for ladies' football: a third association on a third site.
      - name: Fetch ladies' football fixtures from ladiesgaelic.ie
        run: ./scripts/fetch_ladies.py --venues
        continue-on-error: true
      # Club championships from the county and provincial sites. This one accumulates across
      # refreshes (each site shows only a few weeks), so a failure keeps last week's rows.
      - name: Fetch club fixtures from the county and provincial sites
        run: ./scripts/fetch_club.py
        continue-on-error: true
      - name: Geocode any new venues
        run: ./scripts/geocode.py
      - name: Merge venue ids that share a ground
        run: ./scripts/merge_venues.py
      - name: Commit if changed
        run: |
          git config user.name "gaamap bot"
          git config user.email "actions@users.noreply.github.com"
          git add data venues.json
          git diff --cached --quiet || git commit -m "Refresh fixtures $(date -u +%F)"
          git push
