<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAA Map</title>
<meta name="description" content="A map of hurling and Irish football fixtures, filterable by sport, level, competition, team, and date.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>GAA Map</h1>
<p>A filterable map of inter-county hurling and football matches as listed on gaa.ie.</p>
<p id="season"></p>

<details id="guide">
  <summary>Details on the map contents</summary>
  <div id="guide-body"></div>
</details>

<form id="f" onsubmit="return false">
  <div class="row">
    <span class="rowlabel">dates</span>
    <label>from <input id="from" type="date"></label>
    <label>to <input id="to" type="date"></label>
    <span class="nudge"><button type="button" id="earlier" title="Shift the range back by its own length">&lsaquo; earlier</button> <button type="button" id="later" title="Shift the range forward by its own length">later &rsaquo;</button></span>
    <button type="button" id="clear-dates" class="clear" title="Show the whole season">clear</button>
    <span class="presets" id="presets"></span>
  </div>
  <div class="row">
    <span class="rowlabel">sport</span>
    <label><input type="checkbox" name="sport" value="Football" checked> <span class="dot football"></span>football</label>
    <label><input type="checkbox" name="sport" value="Hurling" checked> <span class="dot hurling"></span>hurling</label>
  </div>
  <div class="row">
    <span class="rowlabel">competition</span>
    <label>level <select id="level"><option value="">all</option></select></label>
    <label>competition <select id="comp"><option value="">all</option></select></label>
  </div>
  <div class="row">
    <span class="rowlabel">team</span>
    <input id="team" type="search" placeholder="Kerry" size="14" aria-label="Team">
    <label><input id="results" type="checkbox"> include played matches</label>
    <button type="button" id="reset" class="clear" title="Clear every filter">reset all</button>
  </div>
</form>

<div id="map"></div>
<p class="legend" id="legend"></p>

<p id="count"></p>
<div id="list"></div>

<hr>
<p id="meta"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
